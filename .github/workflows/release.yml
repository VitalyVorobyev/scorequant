name: Release

# A tag is the trigger, so publishing is a deliberate `git push origin v0.1.0`
# rather than a side effect of merging. `workflow_dispatch` runs the gate and
# the build without publishing, so the artifact and its metadata can be
# inspected before a tag exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate is deliberately the full handoff gate, not a subset. A release is
  # the one build nobody re-runs, so it pays for the whole suite.
  verify:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
      MPLBACKEND: Agg
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7
      - name: Lean formal gate
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: agenticresearch/formal
          auto-config: false
          build: true
          build-args: "--wfail"
          leanchecker: true
          axiom-audit: true
          axiom-audit-root: ScoreQuantFormal
          axiom-audit-allow: propext,Classical.choice,Quot.sound
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --all-extras --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src
      - run: uv run pytest -n auto
      - run: uv run mkdocs build --strict
      - name: float32 leg
        env:
          JAX_ENABLE_X64: "0"
        run: uv run pytest tests/test_float32.py

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build
      # The tag and the packaged version must agree, or the artifact on PyPI
      # will not match the commit the tag points at.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          packaged=$(uv run --no-project --with tomli python -c \
            'import tomli;print(tomli.load(open("pyproject.toml","rb"))["project"]["version"])')
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tagged" ]; then
            echo "tag v$tagged does not match pyproject version $packaged" >&2
            exit 1
          fi
      # Catches a README that renders as raw text on the project page, which
      # cannot be fixed after the fact without a new version.
      - name: Check the distribution metadata
        run: uv run --no-project --with twine twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/

  # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no API
  # token exists to leak or rotate. The publisher is configured on pypi.org for
  # owner VitalyVorobyev, repository scorequant, workflow release.yml,
  # environment pypi - all four must keep matching or the exchange is refused.
  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scorequant
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
