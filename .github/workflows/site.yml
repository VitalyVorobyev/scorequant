name: Site

# The one workflow that builds and publishes the site: the Docusaurus portal at
# the root, the strict MkDocs documentation beneath it at `docs/`, and the
# pre-cut redirect stubs, assembled by `pnpm assemble:site` into `.pages-preview`
# and uploaded as a single Pages artifact (ADR 0033; the hand-written landing
# page ADR 0027 put at the root is gone).
#
# A pull request builds the whole tree and uploads it for inspection but never
# deploys; only a push to `main` deploys. This replaces the frozen deployment
# that used to live in `docs.yml`, which would have uploaded `site/` — the
# MkDocs build alone, not the assembled tree — and which was deleted rather
# than un-frozen, because the deployment moved rather than resuming
# (consolidation S11; ADR 0019 and ADR 0025).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # `cache: pnpm` makes setup-node shell out to `pnpm store path`, so corepack
      # has to be enabled on the runner's preinstalled Node first. It is enabled
      # again afterwards to install shims for the Node version setup-node selects.
      # Every pnpm step then runs from `website/`: corepack reads `packageManager`
      # from the nearest package.json to its working directory, and invoking it
      # from the repository root would silently fall back to corepack's own
      # default pnpm, which `engines.pnpm` then rejects.
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: corepack enable
      - run: uv python install 3.13
      - run: uv sync --all-extras --all-groups --locked
      - run: corepack pnpm install --frozen-lockfile
        working-directory: website
      # The strict reference build. This is the only place it runs now that
      # `docs.yml` is gone, so it stays early: a broken reference link fails the
      # pull request here rather than after the portal has been built and tested.
      - run: uv run mkdocs build --strict
      - run: corepack pnpm typecheck
        working-directory: website
      - run: corepack pnpm lint
        working-directory: website
      - run: corepack pnpm test
        working-directory: website
      - run: corepack pnpm build
        working-directory: website
      # Playwright needs its own browser download; `pnpm validate` deliberately
      # omits e2e so the local loop stays fast, so CI is the only place the
      # end-to-end suite runs. Chromium alone covers both configured projects
      # (desktop Chrome and a Pixel 7 emulation).
      - run: corepack pnpm exec playwright install --with-deps chromium
        working-directory: website
      - run: corepack pnpm test:e2e
        working-directory: website
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: website/playwright-report
          if-no-files-found: ignore
      - run: corepack pnpm assemble:site
        working-directory: website
      # `include-hidden-files` is required, not cosmetic: every path segment is
      # tested for a leading dot, so with the default `false` the dot-prefixed
      # preview root makes the whole tree count as hidden and the upload finds
      # nothing. It also keeps the `.nojekyll` marker the static sites rely on.
      - uses: actions/upload-artifact@v6
        with:
          name: scorequant-dual-site-preview
          path: .pages-preview
          if-no-files-found: error
          include-hidden-files: true
      # The Pages artifact is that same assembled tree. `upload-pages-artifact`
      # tars with `-C <path> .`, so the dot-prefixed root is not the hazard it is
      # for `upload-artifact` above, and the `.nojekyll` marker inside travels
      # either way.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-preview

  deploy:
    # Publication is an authorized action, not a merge side effect. This job runs
    # only on a push to the default branch: a pull request builds and uploads the
    # assembled tree for inspection and stops there.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy the assembled site
        id: deployment
        uses: actions/deploy-pages@v5
