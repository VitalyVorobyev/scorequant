<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 245" width="100%" role="img" aria-label="Observation model, score map, score-space quantizer, and discrete label">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#263f73" /></marker></defs>
<rect x="25" y="55" width="190" height="90" rx="12" fill="#f7f1ec" stroke="#deded8" /><text x="120" y="85" text-anchor="middle" font-size="18" font-weight="700">Observation model</text><text x="120" y="113" text-anchor="middle" font-size="16">x ~ Pθ₀</text><text x="120" y="136" text-anchor="middle" font-size="14" fill="#646464">sample / density / integrator</text>
<rect x="285" y="55" width="190" height="90" rx="12" fill="#f0f2f7" stroke="#deded8" /><text x="380" y="85" text-anchor="middle" font-size="18" font-weight="700">Score map</text><text x="380" y="113" text-anchor="middle" font-size="16">s(x) ∈ ℝᵈ</text><text x="380" y="136" text-anchor="middle" font-size="14" fill="#646464">explicit or autodiff</text>
<rect x="545" y="55" width="190" height="90" rx="12" fill="#f3f8f4" stroke="#deded8" /><text x="640" y="85" text-anchor="middle" font-size="18" font-weight="700">Score quantizer</text><text x="640" y="113" text-anchor="middle" font-size="16">q(s) ∈ {1,…,K}</text><text x="640" y="136" text-anchor="middle" font-size="14" fill="#646464">hard / soft during training</text>
<rect x="805" y="55" width="150" height="90" rx="12" fill="#fafafa" stroke="#deded8" /><text x="880" y="88" text-anchor="middle" font-size="18" font-weight="700">Label</text><text x="880" y="118" text-anchor="middle" font-size="17">Z</text>
<line x1="215" y1="100" x2="280" y2="100" stroke="#263f73" stroke-width="2" marker-end="url(#arrow)"></line><line x1="475" y1="100" x2="540" y2="100" stroke="#263f73" stroke-width="2" marker-end="url(#arrow)"></line><line x1="735" y1="100" x2="800" y2="100" stroke="#263f73" stroke-width="2" marker-end="url(#arrow)"></line>
<text x="490" y="205" text-anchor="middle" font-size="14" fill="#646464">Compute each event’s score, then assign its bin. The score distribution determines the information objective.</text>
</svg>