# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: ScoreQuant
site_description: Information-preserving binning for statistical inference
# The learning portal serves the site root; this documentation is mounted beneath it
# at /docs/.
site_url: https://vitalyvorobyev.github.io/scorequant/docs/
repo_url: https://github.com/VitalyVorobyev/scorequant
repo_name: VitalyVorobyev/scorequant
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Vitaly Vorobyev

exclude_docs: |
  development.md
  system-design.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - User guide: guide.md
  - API guide: api.md
  - Reference:
      - Overview: symbols/index.md
      - Fitting: symbols/fitting.md
      - Linear models: symbols/models.md
      - Density ratios: symbols/ratios.md
      - Configuration: symbols/configuration.md
      - Results: symbols/results.md
      - Certificates: symbols/certification.md
      - Information: symbols/information.md
      - Transforms: symbols/transforms.md
      - Plotting (not stable): symbols/plotting.md
  - Glossary: glossary.md
  - Learning portal: https://vitalyvorobyev.github.io/scorequant/

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: list
            inherited_members: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  # The header title links to the portal at the site root, not to this
  # documentation's own index.
  homepage: https://vitalyvorobyev.github.io/scorequant/

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
